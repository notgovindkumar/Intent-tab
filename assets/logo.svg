<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="intentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="#0f172a" rx="24"/>
  
  <!-- Outer glow circle -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#intentGradient)" stroke-width="1" opacity="0.2"/>
  
  <!-- Main circle -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#intentGradient)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Inner circle -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#intentGradient)" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Center dot (focus point) -->
  <circle cx="64" cy="64" r="5" fill="#60a5fa" filter="url(#glow)"/>
  
  <!-- Arrow pointing upward (intent/focus direction) -->
  <g transform="translate(64, 28)">
    <line x1="0" y1="10" x2="0" y2="0" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="0,-4 -3,2 3,2" fill="#60a5fa"/>
  </g>
  
  <!-- Accent lines (focus rays) -->
  <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <!-- Left ray -->
    <line x1="20" y1="64" x2="40" y2="64"/>
    <!-- Right ray -->
    <line x1="88" y1="64" x2="108" y2="64"/>
    <!-- Bottom ray -->
    <line x1="64" y1="88" x2="64" y2="108"/>
  </g>
  
  <!-- Top accent line -->
  <line x1="64" y1="20" x2="64" y2="40" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
